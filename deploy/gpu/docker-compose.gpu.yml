# GPU 加速层：Infinity 推理服务器（bge-m3 嵌入 + bge-reranker 精排）
# 前提: NVIDIA 4090 (24GB) + nvidia-container-toolkit
# 用法: docker compose -f docker-compose.gpu.yml up -d
# 验证: curl http://localhost:7997/v1/models
services:
  infinity:
    image: michaelf34/infinity:latest
    container_name: tc397-rag-infinity
    restart: unless-stopped
    ports:
      - "7997:7997"
    volumes:
      - infinity_models:/app/.cache        # 模型缓存持久化 (~3GB)
    command: >
      v2
      --model-id BAAI/bge-m3
      --model-id BAAI/bge-reranker-v2-m3
      --port 7997
      --engine torch
    environment:
      - HF_ENDPOINT=https://hf-mirror.com   # HF 被墙走镜像
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 可选：Qwen2.5-VL-7B 图表精读（时序图/引脚图页面截图问答）
